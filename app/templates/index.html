<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MailGuard</title>
</head>

<body>

    <header>
        <div>
            <div>●</div>
            <span>MailGuard</span>
        </div>

        <div>
            <span>●</span>
            <span>Model ready</span>
        </div>
    </header>


    <main>

        <section>
            <p>EMAIL ANALYSIS</p>

            <h1>Is this email safe?</h1>

            <p>
                Paste an email below and we’ll check it
                for patterns commonly associated with spam.
            </p>


            <div>
                <textarea
                    id="email-input"
                    placeholder="Paste your email here..."
                    maxlength="10000"
                ></textarea>

                <span id="character-count">
                    0 / 10,000
                </span>
            </div>


            <button id="analyze-button">
                Analyze email →
            </button>


            <p>
                Your email stays in this local demo.
            </p>

        </section>

    </main>

</body>
</html>
